databases:
  - name: greenroom-db
    plan: free
    databaseName: greenroom
    user: greenroom

services:
  - type: web
    name: greenroom
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build && cd .. &&
      alembic upgrade head
    startCommand: gunicorn server:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greenroom-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "20.11.0"
    plan: free
    healthCheckPath: /health
